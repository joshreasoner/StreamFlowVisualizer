name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: azure-app-service
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test StreamFlowVisualizer/tests/StreamFlowVisualizer.Tests/StreamFlowVisualizer.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish StreamFlowVisualizer/StreamFlowVisualizer.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        if: github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
